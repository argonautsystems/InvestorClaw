# GitLab CI/CD for InvestorClaw
#
# InvestorClaw is a Claude Code plugin/skill repo. IC_DECOMPOSITION moved the
# Python engine to ic-engine (pulled as a container over MCP-HTTP) and removed
# the TypeScript plugin build, so there is no root pyproject.toml/package.json
# to `uv sync` or `npm ci` against. CI validates the plugin manifests + skill
# structure that actually ship here.
#
# Per project policy, codex review + local `make ci` remain the canonical gate;
# this pipeline is a lightweight structural guard.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate

validate-plugin:
  stage: validate
  tags: [argos, ncz-os]
  before_script:
    - python3 --version
  script:
    - python3 scripts/validate-plugin.py
